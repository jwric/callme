[workspace]
resolver = "2"
members = ["callme", "callme-cli", "callme-egui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Frando <franz@n0.computer>", "n0 team"]
repository = "https://github.com/n0-computer/callme.git"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
callme = { version = "0.1.0", path = "callme", default-features = false }

anyhow = "1.0.100"
async-channel = "2.5.0"
audio_thread_priority = "0.34.0"
bytes = "1.11.0"
cpal = "0.17.1"
dasp_sample = "0.11.0"
derive_more = { version = "2.1.1", features = ["debug", "deref"] }
fixed-resample = "0.9.2"
iroh = { version = "0.95.1", default-features = false }
iroh-quinn = "0.14.0"
iroh-roq = "0.1.0"
n0-future = "0.3.2"
opus = { git = "https://github.com/DCNick3/opus-rs.git", branch = "unsafe-libopus", default-features = false, features = ["unsafe-libopus-backend"] }
rand = "0.9.2"
rand_core = "0.9"
ringbuf = "0.4.8"
serde = { version = "1.0.218", features = ["derive"] }
spin_sleep = "1.3.0"
tokio = "1.49.0"
tokio-util = { version = "0.7.18", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "std"] }
webrtc-audio-processing = { version = "0.5.0", features = ["bundled", "derive_serde"] }
webrtc-media = "0.11.0"

clap = { version = "4.5.31", features = ["derive"] }
dialoguer = "0.11.0"
hound = "3.5.1"
testresult = "0.4.1"
tracing-test = "0.2.5"
futures-concurrency = "7.7.0"

egui = { version = "0.31.0", default-features = false, features = ["color-hex"] }
eframe = { version = "0.31", default-features = false }
egui-winit = { version = "0.31", default-features = false }
strum = { version = "0.27.2", features = ["derive"] }
android_clipboard = "0.1.0"
tracing-android = "0.2"
arboard = { version = "3.4.1", features = ["wl-clipboard-rs"] }

[patch.crates-io]
iroh-roq = { git = "https://github.com/jwric/iroh-roq.git", branch = "main" }
webrtc-audio-processing = { git = "https://github.com/Frando/webrtc-audio-processing.git", branch = "callme-dev" }
webrtc-audio-processing-sys = { git = "https://github.com/Frando/webrtc-audio-processing.git", branch = "callme-dev" }
