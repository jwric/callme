[package]
name = "callme-cli"
version = "0.1.0"
edition = "2021"
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "make voicecalls over iroh (cli app)"

[package.metadata.wix]
upgrade-guid = "5EE47959-3AF5-4C59-BB50-C27106F2EF0D"
path-guid = "A8E48474-C88A-430F-904A-019A704E797A"
license = false
eula = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.31", features = ["derive"] }
callme = { version = "0.1.0", path = "../callme", default-features = false }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "std"] }
iroh = { version = "0.95.1", default-features = false }
dialoguer = "0.11.0"
n0-future = "0.3.2"

[features]
default = ["audio-processing"]
audio-processing = ["callme/audio-processing"]
