[package]
name = "callme"
version = "0.1.0"
edition = "2021"
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
audio_thread_priority = "0.34.0"
bytes = "1.11.0"
cpal = { version = "0.17.1" }
dasp_sample = "0.11.0"
derive_more = { version = "2.1.1", features = ["debug", "deref"] }
fixed-resample = "0.9.2"
iroh = { version = "0.95.1", default-features = false }
iroh-quinn = "0.14.0"
iroh-roq = "0.1.0"
n0-future = "0.3.2"
# opus = { package = "magnum-opus", version = "0.3" }
opus = { git = "https://github.com/DCNick3/opus-rs.git", branch = "unsafe-libopus", default-features = false, features = [
    "unsafe-libopus-backend",
] }
rand = "0.9.2"
rand_core = "0.9"
ringbuf = "0.4.8"
serde = { version = "1.0.218", features = ["derive"] }
spin_sleep = "1.3.0"
tokio = { version = "1.49.0", features = ["sync"] }
tokio-util = { version = "0.7.18", default-features = false }
tracing = "0.1.44"
webrtc-audio-processing = { version = "0.5.0", optional = true, features = [
    "bundled",
    "derive_serde",
] }
webrtc-media = "0.11.0"

[target.'cfg(target_family = "wasm")'.dependencies]
cpal = { version = "0.17.1", features = ["wasm-bindgen"] }

[dev-dependencies]
clap = { version = "4.5.31", features = ["derive"] }
hound = "3.5.1"
testresult = "0.4.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.22"
tracing-test = "0.2.5"
futures-concurrency = "7.7.0"


[features]
default = ["audio-processing"]
audio-processing = ["webrtc-audio-processing"]
